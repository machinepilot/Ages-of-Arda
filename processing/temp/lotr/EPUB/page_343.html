    <p>320 THE LORD OF THE RINGS “These are Daeron’s Runes, such as were used of old in Moria,’ said Gandalf. ‘Here is written in the tongues of Men and Dwarves: BALIN SON OF FUNDIN LORD OF MORIA.’ ‘He is dead then,’ said Frodo. ‘I feared it was so.’ Gimli cast his hood over his face.</p>
