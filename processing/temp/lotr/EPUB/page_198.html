    <p>STRIDER 175 his blanket. ‘Very ridiculous of you, Frodo! But I wish I had been there to see. The worthies of Bree will be discussing it a hundred years hence.’ ‘I hope so,’ said Strider. Then they all fell silent, and one by one the hobbits dropped off to sleep.</p>
