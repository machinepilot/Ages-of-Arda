    <p>HOMEWARD BOUND 997 ‘Well here we are, just the four of us that started out together,’ said Merry. ‘We have left all the rest behind, one after another. It seems almost like a dream that has slowly faded.’ ‘Not to me,’ said Frodo. “To me it feels more like falling asleep again.’</p>
