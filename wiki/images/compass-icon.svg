<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="#e0cca3" stroke="#b87333" stroke-width="8"/>
  
  <!-- Inner background -->
  <circle cx="100" cy="100" r="80" fill="#f5e7c1" stroke="#b87333" stroke-width="2"/>
  
  <!-- Compass rose -->
  <g id="compass-rose" stroke="#3a2e21" stroke-width="2">
    <!-- Main directions -->
    <line x1="100" y1="30" x2="100" y2="170" stroke-width="3"/>
    <line x1="30" y1="100" x2="170" y2="100" stroke-width="3"/>
    
    <!-- Intermediate directions -->
    <line x1="135" y1="35" x2="65" y2="165" stroke-width="2"/>
    <line x1="35" y1="135" x2="165" y2="65" stroke-width="2"/>
    
    <!-- Direction labels -->
    <text x="100" y="25" text-anchor="middle" font-family="Cinzel, serif" font-weight="bold" font-size="16" fill="#3a2e21">N</text>
    <text x="175" y="105" text-anchor="middle" font-family="Cinzel, serif" font-weight="bold" font-size="16" fill="#3a2e21">E</text>
    <text x="100" y="180" text-anchor="middle" font-family="Cinzel, serif" font-weight="bold" font-size="16" fill="#3a2e21">S</text>
    <text x="25" y="105" text-anchor="middle" font-family="Cinzel, serif" font-weight="bold" font-size="16" fill="#3a2e21">W</text>
  </g>
  
  <!-- Arrow -->
  <g id="arrow">
    <!-- North pointer (blue) -->
    <polygon points="100,40 90,90 100,80 110,90" fill="#5a7c96" stroke="#3a2e21" stroke-width="1.5"/>
    
    <!-- South pointer (green) -->
    <polygon points="100,160 90,110 100,120 110,110" fill="#2e5741" stroke="#3a2e21" stroke-width="1.5"/>
  </g>
  
  <!-- Center decoration -->
  <circle cx="100" cy="100" r="15" fill="#d4af37" stroke="#b87333" stroke-width="2"/>
  <circle cx="100" cy="100" r="8" fill="#b87333" stroke="#3a2e21" stroke-width="1"/>
  
  <!-- Age markers -->
  <g id="age-markers" font-family="Cinzel, serif" font-weight="bold" fill="#3a2e21">
    <circle cx="130" cy="70" r="12" fill="#5a7c96" stroke="#d4af37" stroke-width="1.5"/>
    <text x="130" y="75" text-anchor="middle" font-size="14" fill="#f5e7c1">I</text>
    
    <circle cx="130" cy="130" r="12" fill="#b87333" stroke="#d4af37" stroke-width="1.5"/>
    <text x="130" y="135" text-anchor="middle" font-size="14" fill="#f5e7c1">II</text>
    
    <circle cx="70" cy="130" r="12" fill="#2e5741" stroke="#d4af37" stroke-width="1.5"/>
    <text x="70" y="135" text-anchor="middle" font-size="14" fill="#f5e7c1">III</text>
  </g>
  
  <!-- Decorative runes around the edge -->
  <g id="runes" fill="#b87333" font-family="serif" font-size="10">
    <text x="115" y="40" transform="rotate(20, 115, 40)">✧</text>
    <text x="140" y="60" transform="rotate(40, 140, 60)">❧</text>
    <text x="160" y="90" transform="rotate(60, 160, 90)">✧</text>
    <text x="150" y="130" transform="rotate(100, 150, 130)">❧</text>
    <text x="120" y="160" transform="rotate(160, 120, 160)">✧</text>
    <text x="80" y="160" transform="rotate(200, 80, 160)">❧</text>
    <text x="50" y="130" transform="rotate(240, 50, 130)">✧</text>
    <text x="40" y="90" transform="rotate(280, 40, 90)">❧</text>
    <text x="60" y="60" transform="rotate(320, 60, 60)">✧</text>
    <text x="85" y="40" transform="rotate(340, 85, 40)">❧</text>
  </g>
</svg> 