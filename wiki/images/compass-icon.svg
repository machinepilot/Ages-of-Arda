<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0cca3" />
      <stop offset="100%" stop-color="#b87333" />
    </linearGradient>
    <filter id="compass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#compass-gradient)" stroke="#3a2e21" stroke-width="2" />
  
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="40" fill="#f5e7c1" stroke="#3a2e21" stroke-width="1" />
  
  <!-- Compass Rose -->
  <g filter="url(#compass-shadow)">
    <!-- North-South Needle -->
    <polygon points="50,10 55,50 50,90 45,50" fill="#8b2e2e" />
    
    <!-- East-West Needle -->
    <polygon points="10,50 50,45 90,50 50,55" fill="#2e5741" />
    
    <!-- Compass points -->
    <text x="50" y="20" font-family="Cinzel, serif" font-size="10" text-anchor="middle" fill="#3a2e21">N</text>
    <text x="50" y="85" font-family="Cinzel, serif" font-size="10" text-anchor="middle" fill="#3a2e21">S</text>
    <text x="15" y="53" font-family="Cinzel, serif" font-size="10" text-anchor="middle" fill="#3a2e21">W</text>
    <text x="85" y="53" font-family="Cinzel, serif" font-size="10" text-anchor="middle" fill="#3a2e21">E</text>
    
    <!-- Smaller intermediate compass points -->
    <text x="50" y="35" font-family="Cinzel, serif" font-size="7" text-anchor="middle" fill="#3a2e21" opacity="0.7">Arnor</text>
    <text x="50" y="70" font-family="Cinzel, serif" font-size="7" text-anchor="middle" fill="#3a2e21" opacity="0.7">Gondor</text>
    <text x="30" y="53" font-family="Cinzel, serif" font-size="7" text-anchor="middle" fill="#3a2e21" opacity="0.7">Eriador</text>
    <text x="70" y="53" font-family="Cinzel, serif" font-size="7" text-anchor="middle" fill="#3a2e21" opacity="0.7">Rhûn</text>
  </g>
  
  <!-- Center piece -->
  <circle cx="50" cy="50" r="5" fill="#d4af37" stroke="#3a2e21" stroke-width="1" />
</svg> 