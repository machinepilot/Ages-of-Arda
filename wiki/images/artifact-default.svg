<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with pattern -->
  <rect width="200" height="200" fill="#f5e7c1"/>
  
  <!-- Decorative frame -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#b87333" stroke-width="4" rx="5"/>
  <rect x="20" y="20" width="160" height="160" fill="none" stroke="#d4af37" stroke-width="2" rx="3"/>
  
  <!-- Mystery box/chest -->
  <rect x="50" y="70" width="100" height="70" fill="#b87333" stroke="#3a2e21" stroke-width="2"/>
  <rect x="50" y="70" width="100" height="15" fill="#d4af37" stroke="#3a2e21" stroke-width="1"/>
  
  <!-- Chest lid (slightly open) -->
  <path d="M50,70 L60,50 L140,50 L150,70" fill="#b87333" stroke="#3a2e21" stroke-width="2"/>
  <path d="M60,50 L140,50 L140,65 L60,65 Z" fill="#d4af37" stroke="#3a2e21" stroke-width="1"/>
  
  <!-- Lock -->
  <rect x="90" y="75" width="20" height="15" fill="#d4af37" stroke="#3a2e21" stroke-width="1"/>
  <circle cx="100" cy="82" r="5" fill="#5a7c96" stroke="#3a2e21" stroke-width="1"/>
  
  <!-- Mysterious glow from chest -->
  <ellipse cx="100" cy="60" rx="30" ry="5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Question mark symbol -->
  <text x="100" y="160" text-anchor="middle" font-family="serif" font-size="30" font-weight="bold" fill="#3a2e21">?</text>
  
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="5" fill="#d4af37"/>
  <circle cx="170" cy="30" r="5" fill="#d4af37"/>
  <circle cx="30" cy="170" r="5" fill="#d4af37"/>
  <circle cx="170" cy="170" r="5" fill="#d4af37"/>
</svg> 