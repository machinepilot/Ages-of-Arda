<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Ring outer circle with gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700" />
      <stop offset="50%" style="stop-color:#d4af37" />
      <stop offset="100%" style="stop-color:#b87333" />
    </linearGradient>
  </defs>
  
  <!-- Ring band -->
  <ellipse cx="50" cy="50" rx="30" ry="25" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>
  
  <!-- Ring shadow to give 3D effect -->
  <ellipse cx="50" cy="50" rx="30" ry="25" fill="none" stroke="#3a2e21" stroke-width="1" opacity="0.3"/>
  
  <!-- Ring inner edge highlight -->
  <ellipse cx="50" cy="50" rx="26" ry="21" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.7"/>
  
  <!-- Ring inscription (simplified Elvish-like script) -->
  <g transform="rotate(30, 50, 50)">
    <path d="M35,33 Q50,30 65,33" fill="none" stroke="#3a2e21" stroke-width="1.5" opacity="0.8"/>
    <path d="M30,44 Q50,40 70,44" fill="none" stroke="#3a2e21" stroke-width="1.5" opacity="0.8"/>
    <path d="M30,56 Q50,60 70,56" fill="none" stroke="#3a2e21" stroke-width="1.5" opacity="0.8"/>
    <path d="M35,67 Q50,70 65,67" fill="none" stroke="#3a2e21" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <!-- Gleam of light -->
  <circle cx="35" cy="35" r="3" fill="#ffffff" opacity="0.8"/>
</svg> 