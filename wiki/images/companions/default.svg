<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with parchment texture -->
  <rect width="200" height="300" fill="#e0cca3"/>
  
  <!-- Decorative border -->
  <rect x="5" y="5" width="190" height="290" fill="none" stroke="#b87333" stroke-width="2"/>
  <rect x="10" y="10" width="180" height="280" fill="none" stroke="#b87333" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Elf-like silhouette -->
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="30" ry="40" fill="#3a2e21"/>
  
  <!-- Pointed ears -->
  <path d="M70,70 L60,60 L70,80 Z" fill="#3a2e21"/>
  <path d="M130,70 L140,60 L130,80 Z" fill="#3a2e21"/>
  
  <!-- Body -->
  <path d="M70,120 L130,120 L140,250 L120,270 L80,270 L60,250 Z" fill="#3a2e21"/>
  
  <!-- Arms -->
  <path d="M70,120 L40,180 L50,200 L70,160 Z" fill="#3a2e21"/>
  <path d="M130,120 L160,180 L150,200 L130,160 Z" fill="#3a2e21"/>
  
  <!-- Cloak -->
  <path d="M50,130 L30,250 L60,250 Z" fill="#5a7c96"/>
  <path d="M150,130 L170,250 L140,250 Z" fill="#5a7c96"/>
  
  <!-- Face details (simplified) -->
  <ellipse cx="90" cy="70" rx="3" ry="5" fill="#e0cca3"/>
  <ellipse cx="110" cy="70" rx="3" ry="5" fill="#e0cca3"/>
  <path d="M95,90 L105,90" stroke="#e0cca3" stroke-width="1" fill="none"/>
  
  <!-- Decorative elements for frame -->
  <circle cx="20" cy="20" r="5" fill="#d4af37"/>
  <circle cx="180" cy="20" r="5" fill="#d4af37"/>
  <circle cx="20" cy="280" r="5" fill="#d4af37"/>
  <circle cx="180" cy="280" r="5" fill="#d4af37"/>
  
  <!-- Name placeholder -->
  <rect x="30" y="230" width="140" height="30" fill="#f5e7c1" opacity="0.7"/>
  <text x="100" y="250" text-anchor="middle" font-family="serif" font-size="14" fill="#3a2e21">COMPANION</text>
</svg> 