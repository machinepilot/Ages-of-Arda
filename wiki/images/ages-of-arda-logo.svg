<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0cca3" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="90" cy="90" r="85" fill="url(#bg-gradient)" stroke="#8a7651" stroke-width="3" />
  
  <!-- Three Ages Rings -->
  <circle cx="90" cy="90" r="70" fill="none" stroke="#5a7c96" stroke-width="4" opacity="0.8" />
  <circle cx="90" cy="90" r="55" fill="none" stroke="#2e5741" stroke-width="4" opacity="0.8" />
  <circle cx="90" cy="90" r="40" fill="none" stroke="#8b2e2e" stroke-width="4" opacity="0.8" />
  
  <!-- Central Rune -->
  <text x="90" y="105" font-family="Cinzel, serif" font-size="60" text-anchor="middle" fill="#3a2e21" filter="url(#shadow)">A</text>
  
  <!-- Text around the circle -->
  <path id="top-text-path" d="M 30,90 A 60,60 0 0 1 150,90" fill="none" />
  <path id="bottom-text-path" d="M 150,90 A 60,60 0 0 1 30,90" fill="none" />
  
  <text font-family="Cinzel, serif" font-size="14" fill="#3a2e21" filter="url(#shadow)">
    <textPath href="#top-text-path" startOffset="50%" text-anchor="middle">AGES OF</textPath>
  </text>
  
  <text font-family="Cinzel, serif" font-size="14" fill="#3a2e21" filter="url(#shadow)">
    <textPath href="#bottom-text-path" startOffset="50%" text-anchor="middle">ARDA</textPath>
  </text>
</svg> 