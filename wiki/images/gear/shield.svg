<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield body -->
  <path d="M30,20 L70,20 C75,40 80,60 50,80 C20,60 25,40 30,20 Z" fill="#5a7c96" stroke="#3a2e21" stroke-width="2"/>
  
  <!-- Shield decoration - outer ring -->
  <path d="M35,25 L65,25 C70,40 75,60 50,75 C25,60 30,40 35,25 Z" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  
  <!-- Shield decoration - inner circle -->
  <circle cx="50" cy="45" r="15" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  
  <!-- Shield emblem - white tree -->
  <path d="M50,30 L50,55" stroke="#e0cca3" stroke-width="2" stroke-linecap="round"/>
  <path d="M50,35 L45,40" stroke="#e0cca3" stroke-width="1" stroke-linecap="round"/>
  <path d="M50,40 L55,45" stroke="#e0cca3" stroke-width="1" stroke-linecap="round"/>
  <path d="M50,45 L45,50" stroke="#e0cca3" stroke-width="1" stroke-linecap="round"/>
  <path d="M50,50 L55,55" stroke="#e0cca3" stroke-width="1" stroke-linecap="round"/>
  <circle cx="50" cy="30" r="2" fill="#e0cca3"/>
  
  <!-- Shield metal shine -->
  <path d="M35,30 Q42,40 35,50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
