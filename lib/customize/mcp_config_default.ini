;=============================================================================
; Default Configuration File for Angband with MCP Server Integration
; This file contains default settings that will be used if no user 
; configuration is found.
;=============================================================================

[MCP_SERVER]
; Enable or disable the MCP server integration
enabled=true
; Automatically start the MCP server when the game starts
autostart=true
; Path to the MCP server directory (relative to the game root)
server_path=angband-doc-agent/src
; Port for the MCP server to listen on
port=3000
; Timeout in seconds for MCP server operations
timeout=30
; Number of retry attempts for MCP server operations
retry_attempts=3

[WINDOW_PREFERENCES]
; Enable or disable graphics mode
use_graphics=true
; Graphics mode to use (0-4, where 3 is recommended)
graphics_mode=3
; Font size for the main window
main_font_size=16
; Font size for subwindows
subwindow_font_size=12
; Enable or disable window borders
show_borders=true
; Alpha transparency for inactive windows (0-255)
inactive_alpha=200

[GAMEPLAY]
; Show object flavors in inventory
show_flavors=true
; Automatically pick up items
pickup_always=false
; Confirm when closing windows with unsaved changes
confirm_close=true
; Play sound effects
use_sound=true
; Volume level (0-100)
sound_volume=50

[ADVANCED]
; Enable debug mode
debug_mode=false
; Enable logging
enable_logging=true
; Log level (1-5, where 1 is critical and 5 is debug)
log_level=3
; Autosave frequency in turns
autosave_freq=50
; Maximum number of save files to keep
max_save_files=10

;=============================================================================
; The following variables can be used in paths:
; %BASE_PATH% - The directory where the game executable is located
; %USER_DIR% - The user's home directory (platform-specific)
;============================================================================= 