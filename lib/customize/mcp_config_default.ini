;=============================================================================
; Default Configuration File for Angband with MCP Server Integration
; This file contains default settings that will be used if no user 
; configuration is found.
;=============================================================================

[MCP_SERVER]
; Settings for the Model Context Protocol server
enabled=true              ; Set to true to enable MCP server integration
autostart=true           ; Automatically start the MCP server with the game
server_path=src          ; Path to the MCP server directory (relative to game dir)
port=3000                ; Port for the MCP server to listen on
max_retry=3              ; Maximum number of retry attempts if server fails to start
retry_delay=2000         ; Delay between retry attempts in milliseconds
timeout=5000             ; Timeout for server operations in milliseconds

[WINDOW_PREFERENCES]
; Settings for game windows configuration
main_window_width=800    ; Width of the main game window
main_window_height=600   ; Height of the main game window
font_size=12             ; Font size for the main window
use_graphics=true        ; Use graphical tiles instead of ASCII
graphics_mode=new        ; Graphics mode: "old" or "new"

; Subwindow configuration
subwindows=2             ; Number of subwindows to open
subwindow1_content=messages  ; Content for first subwindow: messages, recall, etc.
subwindow1_height=200    ; Height of first subwindow
subwindow2_content=recall    ; Content for second subwindow: messages, recall, etc.
subwindow2_height=200    ; Height of second subwindow

[GAMEPLAY]
; General gameplay settings
show_flavors=true        ; Show object flavors
pickup_always=false      ; Always pick up items
pickup_inven=true        ; Pick up items if there's room in inventory

[ADVANCED]
; Advanced settings
debug_mode=false         ; Enable debugging features
log_level=info           ; Logging level: debug, info, warn, error
autosave=true            ; Enable autosave
autosave_freq=50         ; Frequency of autosave (in turns)
mcp_logging=true         ; Log MCP server messages

;=============================================================================
; The following variables can be used in paths:
; %BASE_PATH% - The directory where the game executable is located
; %USER_DIR% - The user's home directory (platform-specific)
;============================================================================= 